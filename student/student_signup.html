<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | GardenTrack</title>

    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card signup-card">

            <!-- Logo / Brand -->
            <div class="auth-brand">
                <div class="brand-icon">
                    <img src="../images/logo.svg" alt="GardenTrack Logo" />
                </div>

                <div>
                    <h1>GardenTrack</h1>
                    <p>STUDENT PORTAL</p>
                </div>
            </div>

            <!-- Heading -->
            <div class="auth-header">
                <h2>Student Registration</h2>
                <p>Create your student account to start managing your garden plot.</p>
            </div>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="e.g. student"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="fullname">Full Name</label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="e.g. Alex Rivera"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="e.g. 6+ characters"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="re-enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <p id="signupMessage" class="form-message" aria-live="polite"></p>

            </form>

            <!-- Login Link -->
            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="../index.html">Log in</a>
                </p>
            </div>

        </section>

    </main>

    <footer class="site-footer">
        <div class="footer-brand">
            <strong>GardenTrack</strong>
            <span>School Garden Management Website</span>
        </div>
        <span class="footer-copy">&copy; 2026</span>
    </footer>

    <script src="../js/script.js" defer></script>

</body>
</html>
