<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GardenTrack | Login</title>

    <link rel="icon" type="image/svg+xml" href="images/logo.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body class="login-page">
    <main class="login-container">
      <section class="login-brand">
        <div class="brand-icon">
          <img src="images/logo.svg" alt="GardenTrack Logo" />
        </div>

        <h1>GardenTrack</h1>
        <h2>Management System</h2>

        <p>
          A simple platform for managing student garden plots, recording
          observations, and maintaining garden journals.
        </p>
      </section>

      <section class="login-card">
        <h2>Welcome Back</h2>
        <p class="login-subtitle">Sign in to access your account.</p>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="e.g. student"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="e.g. your account password"
              required
            />
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" />
              Remember me
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary login-btn">
            Sign In
          </button>

          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <div class="auth-footer login-register-links">
          <p>New student? <a href="student/student_signup.html">Register here</a></p>
          <p>Administrator? <a href="admin/admin_signup.html">Create an admin account</a></p>
        </div>

      
      </section>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
