<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Registration | GardenTrack</title>
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card signup-card">
        <div class="auth-brand">
          <div class="brand-icon"><img src="../images/logo.svg" alt="GardenTrack Logo" /></div>
          <div>
            <h1>GardenTrack</h1>
            <p>ADMIN PORTAL</p>
          </div>
        </div>
        <div class="auth-header">
          <h2>Admin Registration</h2>
          <p>Create an administrator account for the garden system.</p>
        </div>
        <form id="adminSignupForm" class="auth-form" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. admin" required />
          </div>
          <div class="form-group">
            <label for="admin-name">Full Name</label>
            <input type="text" id="admin-name" name="admin-name" placeholder="e.g. Alex Rivera" required />
          </div>
          <div class="form-group">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" name="admin-password" placeholder="e.g. 6+ characters" required />
          </div>
          <div class="form-group">
            <label for="admin-confirm-password">Confirm Password</label>
            <input type="password" id="admin-confirm-password" name="admin-confirm-password" placeholder="re-enter your password" required />
          </div>
          <button type="submit" class="auth-button">Create Account</button>
          <p id="adminSignupMessage" class="form-message" aria-live="polite"></p>
        </form>
        <div class="auth-footer">
          <p>Already have an account? <a href="../index.html">Log in</a></p>
          <p>Need a student account? <a href="../student/student_signup.html">Register as a student</a></p>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-brand">
        <strong>GardenTrack</strong>
        <span>School Garden Management Website</span>
      </div>
      <span class="footer-copy">&copy; 2026</span>
    </footer>
    <script src="../js/script.js"></script>
  </body>
</html>
